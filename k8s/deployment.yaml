apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-go
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse-go
  template:
    metadata:
      labels:
        app: pulse-go
    spec:
      containers:
      - name: pulse-go
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests: { cpu: 20m, memory: 16Mi }
          limits: { cpu: 100m, memory: 64Mi }
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
