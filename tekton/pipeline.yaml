apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-deploy
  namespace: pulse-ci
spec:
  params:
  - name: repo-url
  - name: revision
    default: main
  - name: image
  workspaces:
  - name: source
  - name: dockerconfig
  tasks:
  - name: clone
    taskRef:
      name: git-clone-simple
    params:
    - name: repo-url
      value: $(params.repo-url)
    - name: revision
      value: $(params.revision)
    workspaces:
    - name: source
      workspace: source
  - name: build-push
    taskRef:
      name: kaniko-build-push
    params:
    - name: image
      value: $(params.image)
    - name: tag
      value: $(tasks.clone.results.commit)
    workspaces:
    - name: source
      workspace: source
    - name: dockerconfig
      workspace: dockerconfig
  - name: deploy
    runAfter: ["build-push"]
    taskRef:
      name: deploy-to-k8s
    params:
    - name: image
      value: $(params.image)
    - name: tag
      value: $(tasks.clone.results.commit)
    workspaces:
    - name: source
      workspace: source
